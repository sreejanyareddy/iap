version: '3'

services:

  redis:
    image: redis:7
    container_name: chat_redis
    ports:
      - "6379:6379"

  server1:
    build: .
    container_name: chat_server1
    command: python server.py 5005
    ports:
      - "5005:5005"
    depends_on:
      - redis

  server2:
    build: .
    container_name: chat_server2
    command: python server.py 5006
    ports:
      - "5006:5006"
    depends_on:
      - redis